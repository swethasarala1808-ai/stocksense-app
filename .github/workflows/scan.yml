name: StockSense scan
on:
  schedule:
    - cron: "30 3 * * 1-5"      # 9:00 IST, before market opens
    - cron: "35 4-9 * * 1-5"    # hourly during market hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python export_picks.py
      - run: |
          git config user.name "stocksense-bot"
          git config user.email "stocksense-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || { git commit -m "Update picks"; git pull --rebase -X theirs origin main; git push; }
